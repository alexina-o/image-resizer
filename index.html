<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      max-width: 650px; 
      margin: 40px auto; 
      padding: 0 20px 100px 20px; 
      color: #333; 
      position: relative;
      min-height: 90vh;
    }
    .card { background: #f9f9f9; border: 1px solid #e2e2e2; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .full-width { grid-column: span 2; }
    label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 3px; }
    .help-text { font-size: 12px; color: #666; font-weight: normal; margin-bottom: 6px; display: block; }
    input[type="text"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
    #drop-zone {
      border: 3px dashed #0070f3; border-radius: 12px; padding: 40px;
      text-align: center; font-weight: bold; background: #f0f7ff; cursor: pointer; transition: 0.2s ease;
    }
    #drop-zone.hover { border-color: #0051b3; background: #e1effe; }
    #status { margin-top: 15px; font-weight: 600; text-align: center; color: #555; }
    .contact-footer {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 8px;
    }
    .corner-avatar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 2px solid #fff;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <h2>Image Resizer</h2>

  <!-- Controls Panel -->
  <div class="card">
    <div class="full-width">
      <label for="preset-select">Preset Options</label>
      <select id="preset-select">
        <option value="packshot" selected>Packshot / Swatch</option>
        <option value="lifestyle">Lifestyle</option>
        <option value="custom">Custom</option>
      </select>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="enable-trim" checked>
      <label for="enable-trim" style="margin:0;">Enable Auto-Trim (Crop whitespace/borders)</label>
    </div>

    <div class="form-grid">
      <div>
        <label for="resize-dim">Resize Geometry (W x H)</label>
        <span class="help-text">Size of product</span>
        <input type="text" id="resize-dim" value="1800x1800">
      </div>
      <div>
        <label for="extent-dim">Canvas Extent (W x H)</label>
        <span class="help-text">Final image size</span>
        <input type="text" id="extent-dim" value="2000x2000">
      </div>
      <div>
        <label for="gravity-val">Alignment (Gravity)</label>
        <select id="gravity-val">
          <option value="Center" selected>Center</option>
          <option value="North">North (Top)</option>
          <option value="South">South (Bottom)</option>
          <option value="West">West (Left)</option>
          <option value="East">East (Right)</option>
        </select>
      </div>
      <div>
        <label for="output-format">Format</label>
        <select id="output-format">
          <option value="Png" selected>PNG</option>
          <option value="Jpeg">JPEG</option>
          <option value="Webp">WEBP</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Drop Zone -->
  <div id="drop-zone">Drag and drop images here to process</div>
  <div id="status">Ready...</div>
  <div class="contact-footer">Issues? Questions? Improvements? Contact alexina on Slack</div>

  <!-- Embedded Corner Image -->
  <img class="corner-avatar" src="alex.jpg" alt="Alexina Avatar">

  <script type="module">
    import { 
      initializeImageMagick, 
      ImageMagick, 
      MagickFormat, 
      MagickGeometry, 
      Gravity 
    } from 'https://unpkg.com/@imagemagick/magick-wasm@0.0.30/dist/index.js';

    const dropZone = document.getElementById('drop-zone');
    const status = document.getElementById('status');
    const presetSelect = document.getElementById('preset-select');
    const trimCheckbox = document.getElementById('enable-trim');
    const resizeInput = document.getElementById('resize-dim');
    const extentInput = document.getElementById('extent-dim');
    const gravitySelect = document.getElementById('gravity-val');
    const formatSelect = document.getElementById('output-format');

    const presets = {
      packshot: { trim: true, resize: '1800x1800', extent: '2000x2000', gravity: 'Center' },
      lifestyle: { trim: false, resize: '2000x2000', extent: '2000x2000', gravity: 'Center' }
    };

    presetSelect.addEventListener('change', () => {
      const selected = presetSelect.value;
      if (presets[selected]) {
        trimCheckbox.checked = presets[selected].trim;
        resizeInput.value = presets[selected].resize;
        extentInput.value = presets[selected].extent;
        gravitySelect.value = presets[selected].gravity;
      }
    });

    [trimCheckbox, resizeInput, extentInput, gravitySelect, formatSelect].forEach(element => {
      element.addEventListener('input', () => { presetSelect.value = 'custom'; });
      element.addEventListener('change', () => { presetSelect.value = 'custom'; });
    });

    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('hover')));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('hover')));
    
    document.body.addEventListener('dragover', e => e.preventDefault());
    document.body.addEventListener('drop', e => e.preventDefault());

    function parseGeometry(str) {
      const parts = str.toLowerCase().split('x');
      return { width: parseInt(parts[0]) || 0, height: parseInt(parts[1]) || 0 };
    }

    function processImage(file, doTrim, resizeVals, extentVals, gravityChoice, formatChoice) {
      return new Promise(async (resolve, reject) => {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const content = new Uint8Array(arrayBuffer);

          ImageMagick.read(content, (img) => {
            if (doTrim) {
              img.trim();
            }
            if (resizeVals.width && resizeVals.height) {
              img.resize(new MagickGeometry(resizeVals.width, resizeVals.height));
            }
            if (extentVals.width && extentVals.height) {
              img.extent(new MagickGeometry(extentVals.width, extentVals.height), Gravity[gravityChoice]);
            }

            img.write(MagickFormat[formatChoice], (outData) => {
              const bufferCopy = new Uint8Array(outData);
              const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
              const ext = formatChoice.toLowerCase() === 'jpeg' ? 'jpg' : formatChoice.toLowerCase();
              
              resolve({
                filename: `${baseName}.${ext}`,
                data: bufferCopy
              });
            });
          });
        } catch (err) {
          reject(err);
        }
      });
    }

    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      if (!files.length) return alert('Please drop valid image files!');

      const doTrim = trimCheckbox.checked;
      const resizeVals = parseGeometry(resizeInput.value);
      const extentVals = parseGeometry(extentInput.value);
      const gravityChoice = gravitySelect.value;
      const formatChoice = formatSelect.value;

      status.innerText = `Loading ImageMagick Engine...`;

      try {
        const response = await fetch('./magick.wasm');
        if (!response.ok) throw new Error(`Failed to load ./magick.wasm file: ${response.statusText}`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        
        await initializeImageMagick(bytes);

        const zip = new JSZip();

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          status.innerText = `Processing (${i + 1}/${files.length}): ${file.name}...`;

          const processed = await processImage(file, doTrim, resizeVals, extentVals, gravityChoice, formatChoice);
          zip.file(processed.filename, processed.data);
        }

        status.innerText = 'Creating ZIP file...';
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipBlob);
        link.download = `processed_images.zip`;
        link.click();

        status.innerText = 'Done! ZIP file downloaded.';
      } catch (err) {
        console.error(err);
        status.innerText = `Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
